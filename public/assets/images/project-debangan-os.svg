<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" role="img" aria-label="Debangan OS: a provenance-tracked knowledge graph behind a policy gate">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1c1e"/>
      <stop offset="1" stop-color="#2b2a24"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffdb70"/>
      <stop offset="1" stop-color="#e5a13c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#ffdb70" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffdb70" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="600" height="450" fill="url(#bg)"/>
  <rect width="600" height="450" fill="url(#grid)"/>
  <rect width="600" height="450" fill="url(#glow)"/>

  <text x="300" y="60" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#f8f8f8" letter-spacing="2">Debangan OS</text>

  <!-- records -> memory -> graph -> advisor, then the policy gate, then any model -->
  <g stroke="#ffdb70" stroke-opacity="0.45" stroke-width="1.5" fill="none">
    <path d="M110 150 L190 225"/><path d="M110 225 L190 225"/><path d="M110 300 L190 225"/>
    <path d="M190 225 L280 160"/><path d="M190 225 L280 290"/><path d="M280 160 L280 290"/>
    <path d="M280 160 L372 225"/><path d="M280 290 L372 225"/>
    <path d="M372 225 L446 225" stroke-dasharray="6 6"/>
  </g>
  <g fill="#2a2a2c" stroke="#ffdb70" stroke-width="1.5">
    <circle cx="110" cy="150" r="12"/><circle cx="110" cy="225" r="12"/><circle cx="110" cy="300" r="12"/>
    <circle cx="190" cy="225" r="16"/>
    <circle cx="280" cy="160" r="14"/><circle cx="280" cy="290" r="14"/>
    <circle cx="372" cy="225" r="18" fill="#ffdb70"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#9a9a9a" text-anchor="middle">
    <text x="110" y="128">RECORD</text>
    <text x="110" y="330">RECORD</text>
    <text x="190" y="260">memory</text>
    <text x="280" y="138">DERIVED</text>
    <text x="280" y="320">INFERRED</text>
    <text x="372" y="262">advisor</text>
  </g>

  <!-- policy gate -->
  <rect x="418" y="140" width="4" height="170" rx="2" fill="url(#gold)"/>
  <text x="420" y="128" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#ffdb70">policy gate</text>

  <!-- swappable model slot -->
  <rect x="446" y="195" width="98" height="60" rx="12" fill="#121214" stroke="#ffffff" stroke-opacity="0.14" stroke-dasharray="5 4"/>
  <text x="495" y="220" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#d6d6d6">any model</text>
  <text x="495" y="240" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#6f6f6f">swappable</text>

  <!-- lock -->
  <g transform="translate(60 372)">
    <rect x="0" y="10" width="22" height="16" rx="3" fill="#ffdb70"/>
    <path d="M4 10V7a7 7 0 0 1 14 0v3" fill="none" stroke="#ffdb70" stroke-width="2.5"/>
  </g>
  <text x="92" y="391" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#9a9a9a">private by construction · evidence over story</text>

  <text x="300" y="424" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="url(#gold)" letter-spacing="1">The model is replaceable. The knowledge is mine.</text>
</svg>
